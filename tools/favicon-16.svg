<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <title>The Leap Second Preservation Society (16px)</title>
  <!--
    Pixel-grid icon for the 16x16 entry in favicon.ico. Drawn on the grid by
    hand because downscaling the serif favicon.svg turns the numerals to
    grey mush. No serifs at this size; the 37 is the message, not the face.
  -->
  <rect width="16" height="16" fill="#f7f3e8"/>
  <g fill="#1e3d2f">
    <!-- 3 -->
    <rect x="1" y="2" width="6" height="2"/>
    <rect x="5" y="4" width="2" height="2"/>
    <rect x="3" y="6" width="4" height="2"/>
    <rect x="5" y="8" width="2" height="4"/>
    <rect x="1" y="12" width="6" height="2"/>
    <rect x="1" y="10" width="2" height="2"/>
    <!-- 7 -->
    <rect x="9" y="2" width="6" height="2"/>
    <rect x="13" y="4" width="2" height="2"/>
    <rect x="12" y="6" width="2" height="2"/>
    <rect x="11" y="8" width="2" height="2"/>
    <rect x="10" y="10" width="2" height="4"/>
  </g>
</svg>
