<!-- Pixel-grid 16px icon, used only for the smallest favicon.ico entry.
     "37" in a 3x5 pixel font, white on the campaign orange; outlined type
     is unreadable at this size, pixels are not. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <rect width="16" height="16" fill="#e8420b"/>
  <g fill="#ffffff">
    <rect x="1" y="3" width="6" height="2"/>
    <rect x="5" y="5" width="2" height="2"/>
    <rect x="1" y="7" width="6" height="2"/>
    <rect x="5" y="9" width="2" height="2"/>
    <rect x="1" y="11" width="6" height="2"/>
    <rect x="9" y="3" width="6" height="2"/>
    <rect x="13" y="5" width="2" height="2"/>
    <rect x="13" y="7" width="2" height="2"/>
    <rect x="11" y="9" width="2" height="2"/>
    <rect x="11" y="11" width="2" height="2"/>
  </g>
</svg>
