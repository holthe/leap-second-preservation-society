<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 425" width="1200" height="425" role="img" aria-label="The Leap Second Preservation Society">
  <title>The Leap Second Preservation Society</title>
  <!--
    Source for assets/logo.svg. The committed logo has this text outlined to
    paths (make logo) so the README renders the same whether or not the
    viewer has Georgia. The outline pass wants a metric-compatible Georgia
    (Gelasio) on the fontconfig path; see the README.
  -->
  <rect width="1200" height="425" fill="#1e3d2f"/>
  <rect x="20" y="20" width="1160" height="385" fill="none" stroke="#a9822f" stroke-width="2"/>
  <rect x="27" y="27" width="1146" height="371" fill="none" stroke="#a9822f" stroke-width="1"/>
  <g font-family="Georgia, serif" text-anchor="middle">
    <text x="600" y="118" font-size="36" letter-spacing="6" fill="#c9bd93">23:59:<tspan fill="#a9822f">60</tspan></text>
    <text x="600" y="240" font-size="96" font-style="italic" fill="#f7f3e8">The Leap Second</text>
    <text x="600" y="352" font-size="96" font-style="italic" fill="#a9822f">Preservation Society</text>
  </g>
</svg>
