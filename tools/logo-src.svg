<!-- Source for assets/logo.svg. Text is still live here; `make logo` runs
     Inkscape with export-text-to-path so the committed logo does not depend
     on the viewer's fonts. The campaign wordmark is Helvetica-family bold;
     on this machine it renders through Liberation Sans, which is
     metric-compatible with Arial and close enough to the site's stack. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 400" width="1240" height="400" role="img" aria-label="The Leap Second Preservation Society">
  <rect width="1240" height="400" fill="#ffffff"/>
  <text x="70" y="272" font-family="Liberation Sans, Arial, sans-serif" font-weight="bold" font-size="270" letter-spacing="-14" fill="#101214">37</text>
  <rect x="404" y="228" width="46" height="46" fill="#e8420b"/>
  <text x="520" y="150" font-family="Liberation Sans, Arial, sans-serif" font-weight="bold" font-size="52" letter-spacing="-1" fill="#101214">The Leap Second</text>
  <text x="520" y="212" font-family="Liberation Sans, Arial, sans-serif" font-weight="bold" font-size="52" letter-spacing="-1" fill="#101214">Preservation Society</text>
  <text x="521" y="262" font-family="Liberation Sans, Arial, sans-serif" font-weight="bold" font-size="21" letter-spacing="2" fill="#e8420b">ONLY 37 REMAIN &#183; NONE INSERTED SINCE 2016</text>
  <text x="521" y="298" font-family="Liberation Sans, Arial, sans-serif" font-size="22" fill="#5c6166">Because the Earth cannot keep time, and should not have to.</text>
</svg>
