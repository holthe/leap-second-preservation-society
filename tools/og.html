<!DOCTYPE html>
<!--

<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

    background: #ffffff;

    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;

  .mid {
    flex: 1;
    padding: 0 76px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .eyebrow {
    font-size: 19px; letter-spacing: 0.14em; text-transform: uppercase;
    color: #e8420b; font-weight: 800;

    font-size: 44px; font-weight: 800; letter-spacing: -0.02em; margin-top: 18px;

    flex: none;
    padding: 0 76px 26px;
    display: flex; justify-content: space-between;
    font-size: 16px; color: #5c6166;
    text-transform: uppercase; letter-spacing: 0.12em; font-weight: 700;

  <div class="mid">
    <div class="eyebrow">Only 37 remain &middot; None inserted since 2016</div>

  </div>
  <div class="foot">
    <span>DOC: BEI-007</span>
